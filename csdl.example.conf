# Example CSDL configuration. Use with:  ./bin/engine --config csdl.example.conf
# Any key can also be given on the command line, e.g. --random-objects=20 --no-gravity
# Run ./bin/engine --help for the full list with defaults.

window_width  = 1280
window_height = 800
physics_hz    = 120
vsync         = true
time_scale    = 1.0

# Sandbox panel (F1 toggles it at runtime)
skip_menu = false
show_ui  = true
ui_scale = 1.25

# Start from a saved scene file (R reloads it) ...
# scene = my_test.txt
# ... or a built-in preset: default, empty, random, orbits, head_on, cradle, container
# preset = orbits
# ... or: 0 = default two-body scene; N > 0 = N random circles/rectangles
random_objects = 0
max_objects    = 200
# Fixed seed for random scenes (0 = a new one on every start)
seed           = 0

# Headless mode: physics only, prints statistics and exits (see README). Left commented out so
# that `--headless --config csdl.example.conf` still runs headless.
# headless        = true
# duration        = 10
# report_interval = 1
# save_scene      = after.txt

gravity                = true
gravitational_constant = 100
softening              = 5
border_collision       = true
max_speed              = 500
restitution_threshold  = 20

render_trails               = true
render_direction            = true
render_collision_highlights = true
color_cycle                 = false

sound  = true
volume = 10
# music_path = sounds/your-music.ogg

log_level = info
