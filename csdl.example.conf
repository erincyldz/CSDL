# Example CSDL configuration. Use with:  ./bin/engine --config csdl.example.conf
# Any key can also be given on the command line, e.g. --random-objects=20 --no-gravity
# Run ./bin/engine --help for the full list with defaults.

window_width  = 1280
window_height = 800
physics_hz    = 120
vsync         = true
time_scale    = 1.0

# Sandbox panel (F1 toggles it at runtime)
show_ui  = true
ui_scale = 1.25

# Start from a saved scene file (R reloads it) ...
# scene = my_test.txt
# ... or: 0 = default two-body scene; N > 0 = N random circles/rectangles
random_objects = 0
max_objects    = 200

gravity                = true
gravitational_constant = 100
softening              = 5
border_collision       = true
max_speed              = 500
restitution_threshold  = 20

render_trails               = true
render_direction            = true
render_collision_highlights = true
color_cycle                 = false

sound  = true
volume = 10
# music_path = sounds/your-music.ogg

log_level = info
